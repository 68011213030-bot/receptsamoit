<style>
:root{--blue:#1565C0;--navy:#0B1F33;--bg:#F4F7FB;--white:#fff;--line:#DDE5EF;--text:#17212B;--muted:#667789;--danger:#C62828;--ok:#2E7D32}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.sidebar{position:fixed;inset:0 auto 0 0;width:240px;background:var(--navy);color:#fff;padding:18px;display:flex;flex-direction:column;z-index:20}.brand{display:flex;gap:10px;align-items:center;margin-bottom:25px}.brand img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:8px}.brand small{display:block;color:#B9C8D8}.sidebar nav{display:grid;gap:6px}.sidebar nav button,.sidebar-bottom button{background:transparent;border:0;color:#fff;text-align:left;padding:12px;border-radius:8px}.sidebar nav button:hover,.sidebar-bottom button:hover{background:#173653}.sidebar-bottom{margin-top:auto}
.main{margin-left:240px;min-height:100vh}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 20px;position:sticky;top:0;z-index:10}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px}.searchbox{flex:1}.searchbox input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px}.top-actions{display:flex;gap:8px;align-items:center}.user-chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px}.content{padding:22px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.page-head h2{margin:0 0 5px}.page-head p{margin:0;color:var(--muted)}
.primary,.secondary{border:0;border-radius:8px;padding:10px 15px}.primary{background:var(--blue);color:#fff}.secondary{background:#E9F0F8;color:var(--navy)}.full{width:100%}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 2px 8px #0b1f3310}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.stat b{font-size:28px;display:block;color:var(--blue)}.stat span{color:var(--muted);font-size:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#F7F9FC}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#EAF2FC;color:var(--blue);font-size:12px}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:7px}.event-list,.announcement-list{display:grid;gap:10px}.event,.announcement{background:#fff;border:1px solid var(--line);padding:15px;border-radius:10px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-grid label{display:grid;gap:6px;color:var(--muted);font-size:13px}.form-grid input,.form-grid textarea,.form-grid select{border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--text)}.wide{grid-column:1/-1}.report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.action{text-align:left;border:1px solid var(--line)}
.login-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef5fc,#fff)}.login-card{width:min(420px,92vw);background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 10px 35px #0b1f3314}.login-card .logo{width:74px;height:74px;object-fit:contain}.login-card h1{margin:10px 0 5px;color:var(--navy)}.login-card p{color:var(--muted)}.login-card form{display:grid;gap:7px}.login-card label{font-size:13px;color:var(--muted)}.login-card input{padding:11px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}.divider{text-align:center;color:#999;margin:16px 0}
.toast{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;padding:12px 15px;border-radius:9px;z-index:100}.modal-backdrop{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:90}.modal{width:min(720px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:20px}.modal h3{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}.report-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.topbar{padding:9px 10px}.content{padding:14px}.stats,.grid2,.form-grid{grid-template-columns:1fr}.report-grid{grid-template-columns:1fr}.searchbox{display:none}}
</style>
