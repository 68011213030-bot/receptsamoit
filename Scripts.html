<script>
let TOKEN=localStorage.getItem('reception_token')||'', ME=null, CURRENT_PAGE='';
const $=id=>document.getElementById(id);
function call(action,payload={}){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>{if(!r||!r.ok){toast(r&&r.error||'เกิดข้อผิดพลาด');reject(new Error(r&&r.error||'error'));}else resolve(r)}).withFailureHandler(e=>{toast(e.message||'เชื่อมต่อระบบไม่ได้');reject(e)}).api(action,{...payload,token:TOKEN})}
function toast(m){let x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2800)}
function toggleSidebar(){$('sidebar').classList.toggle('open')}
async function login(e){e.preventDefault();try{const r=await call('login',{email:$('email').value,password:$('password').value});TOKEN=r.token;localStorage.setItem('reception_token',TOKEN);ME=r.user;enterApp()}catch(e){}}
async async function googleLogin(){try{const r=await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).googleLogin());if(!r.ok)throw new Error(r.error);TOKEN=r.token;localStorage.setItem('reception_token',TOKEN);ME=r.user;enterApp()}catch(e){toast(e.message||'Google Login ไม่สำเร็จ')}}
async function enterApp(){ $('loginView').classList.add('hidden');$('shell').classList.remove('hidden');$('userName').textContent=ME.name||ME.email;showPage('dashboard')}
async function boot(){if(!TOKEN)return;try{const r=await call('me');ME=r.user;enterApp()}catch(e){localStorage.removeItem('reception_token');TOKEN=''}}
boot();
function logout(){call('logout').finally(()=>{localStorage.removeItem('reception_token');location.reload()})}
function showPage(page){
 CURRENT_PAGE=page; const t=document.getElementById('tpl-'+page); if(!t)return; $('content').innerHTML=t.innerHTML;
 if(page==='dashboard')refreshDashboard(); if(page==='documents')loadDocuments(''); if(page==='parcels')loadParcels(); if(page==='lostfound')loadLost(); if(page==='calendar')loadEvents(); if(page==='announcements')loadAnnouncements(); if(page==='admin')loadAdmins();
}
async function refreshDashboard(){const r=await call('dashboard');const d=r.data;$('stats').innerHTML=[['เอกสารทั้งหมด',d.documents],['รอดำเนินการ',d.pendingDocuments],['เกินกำหนด',d.overdueDocuments],['พัสดุรอรับ',d.pendingParcels],['ของหาย',d.lost],['ของที่พบ',d.found]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');$('upcoming').innerHTML=d.upcomingEvents.map(e=>`<div class="event"><b>${esc(e.Title)}</b><div>${esc(e.Start)} · ${esc(e.Location)}</div></div>`).join('')||'<p>ไม่มีกิจกรรม</p>';$('latestAnnouncements').innerHTML=d.announcements.map(a=>`<div class="announcement"><b>${esc(a.Title)}</b><div>${esc(a.PublishDate||'')}</div></div>`).join('')||'<p>ไม่มีประกาศ</p>'}
async function loadDocuments(type){const r=await call('documents',{type});$('documentsBody').innerHTML=r.data.map(d=>`<tr><td>${esc(d.DocumentID)}</td><td>${esc(d.Subject)}</td><td>${esc(d.Sender||d.Recipient)}</td><td>${esc(d.DueDate||d.ReplyDueDate||'-')}</td><td><span class="badge">${esc(d.Status)}</span></td><td><button class="secondary" onclick='documentForm("${d.DocumentID.startsWith("DOC-OUT")?"OUT":"IN"}",${JSON.stringify(d).replace(/'/g,"&#39;")})'>แก้ไข</button></td></tr>`).join('')}
function documentForm(type,d={}){modal(`<h3>${type==='OUT'?'ส่งเอกสาร':'รับเอกสาร'}</h3><div class="form-grid"><label>เรื่อง<input id="fSubject" value="${esc(d.Subject||'')}"></label><label>${type==='OUT'?'ผู้รับ':'ผู้ส่ง'}<input id="fPerson" value="${esc(d[type==='OUT'?'Recipient':'Sender']||'')}"></label><label>Email<input id="fEmail" value="${esc(d.Email||'')}"></label><label>เบอร์โทร<input id="fPhone" value="${esc(d.Phone||'')}"></label><label>หน่วยงาน<input id="fDept" value="${esc(d.Department||'')}"></label><label>วันครบกำหนด<input id="fDue" type="date" value="${esc(d.DueDate||d.ReplyDueDate||'')}"></label><label class="wide">รายละเอียด<textarea id="fDetails">${esc(d.Details||'')}</textarea></label></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">ยกเลิก</button><button class="primary" onclick='saveDocument("${type}","${esc(d.DocumentID||'')}")'>บันทึก</button></div>`)}
async function saveDocument(type,id){const out=type==='OUT',d={Type:type,DocumentID:id,Subject:$('fSubject').value,[out?'Recipient':'Sender']:$('fPerson').value,Email:$('fEmail').value,Phone:$('fPhone').value,Department:$('fDept').value,[out?'ReplyDueDate':'DueDate']:$('fDue').value,Details:$('fDetails').value};await call('documentSave',{data:d});closeModal();loadDocuments(type)}
async function loadParcels(){const r=await call('parcels');$('parcelsBody').innerHTML=r.data.map(p=>`<tr><td>${esc(p.ParcelID)}</td><td>${esc(p.Recipient)}</td><td>${esc(p.TrackingNumber)}</td><td>${esc(p.DueDate||'-')}</td><td><span class="badge">${esc(p.Status)}</span></td><td><button class="secondary" onclick='parcelForm(${JSON.stringify(p)})'>แก้ไข</button></td></tr>`).join('')}
function parcelForm(d={}){modal(`<h3>พัสดุ</h3><div class="form-grid"><label>ผู้รับ<input id="pRecipient" value="${esc(d.Recipient||'')}"></label><label>Email<input id="pEmail" value="${esc(d.RecipientEmail||'')}"></label><label>เบอร์โทร<input id="pPhone" value="${esc(d.RecipientPhone||'')}"></label><label>บริษัทขนส่ง<input id="pCarrier" value="${esc(d.Carrier||'')}"></label><label>Tracking<input id="pTracking" value="${esc(d.TrackingNumber||'')}"></label><label>วันครบกำหนด<input id="pDue" type="date" value="${esc(d.DueDate||'')}"></label><label class="wide">รายละเอียด<textarea id="pDetails">${esc(d.Details||'')}</textarea></label></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">ยกเลิก</button><button class="primary" onclick='saveParcel("${esc(d.ParcelID||'')}")'>บันทึก</button></div>`)}
async function saveParcel(id){await call('parcelSave',{data:{ParcelID:id,Recipient:$('pRecipient').value,RecipientEmail:$('pEmail').value,RecipientPhone:$('pPhone').value,Carrier:$('pCarrier').value,TrackingNumber:$('pTracking').value,DueDate:$('pDue').value,Details:$('pDetails').value}});closeModal();loadParcels()}
async function loadLost(){const r=await call('lostFound');$('lostBody').innerHTML=r.data.map(x=>`<tr><td>${esc(x.ItemID)}</td><td>${esc(x.Kind)}</td><td>${esc(x.Name)}</td><td>${esc(x.Location)}</td><td>${esc(x.Color)}</td><td><span class="badge">${esc(x.Status)}</span></td><td><button class="secondary" onclick='lostForm(${JSON.stringify(x)})'>แก้ไข</button></td></tr>`).join('')}
function lostForm(d={}){modal(`<h3>Lost & Found</h3><div class="form-grid"><label>ประเภท<select id="lKind"><option value="LOST" ${d.Kind==='LOST'?'selected':''}>ของหาย</option><option value="FOUND" ${d.Kind==='FOUND'?'selected':''}>ของที่พบ</option></select></label><label>ชื่อสิ่งของ<input id="lName" value="${esc(d.Name||'')}"></label><label>ประเภทสิ่งของ<input id="lCat" value="${esc(d.Category||'')}"></label><label>สี<input id="lColor" value="${esc(d.Color||'')}"></label><label>สถานที่<input id="lLoc" value="${esc(d.Location||'')}"></label><label>วันที่<input id="lDate" type="date" value="${esc(d.Date||'')}"></label><label class="wide">รายละเอียด<textarea id="lDetails">${esc(d.Details||'')}</textarea></label></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">ยกเลิก</button><button class="primary" onclick='saveLost("${esc(d.ItemID||'')}")'>บันทึก</button></div>`)}
async function saveLost(id){await call('lostFoundSave',{data:{ItemId:id,ItemID:id,Kind:$('lKind').value,Name:$('lName').value,Category:$('lCat').value,Color:$('lColor').value,Location:$('lLoc').value,Date:$('lDate').value,Details:$('lDetails').value}});closeModal();loadLost()}
async function loadEvents(){const r=await call('events');$('calendarList').innerHTML=r.data.map(e=>`<div class="event"><b>${esc(e.Title)}</b><div>${esc(e.Start)} → ${esc(e.End||'')}</div><div>${esc(e.Location||'')}</div><button class="secondary" onclick='eventForm(${JSON.stringify(e)})'>แก้ไข</button></div>`).join('')}
function eventForm(d={}){modal(`<h3>กิจกรรม</h3><div class="form-grid"><label>ชื่อกิจกรรม<input id="eTitle" value="${esc(d.Title||'')}"></label><label>ประเภท<input id="eType" value="${esc(d.Type||'')}"></label><label>เริ่ม<input id="eStart" type="datetime-local" value="${esc((d.Start||'').replace(' ','T').slice(0,16))}"></label><label>สิ้นสุด<input id="eEnd" type="datetime-local" value="${esc((d.End||'').replace(' ','T').slice(0,16))}"></label><label>สถานที่<input id="eLoc" value="${esc(d.Location||'')}"></label><label>Email<input id="eEmail" value="${esc(d.Email||'')}"></label><label class="wide">รายละเอียด<textarea id="eDetails">${esc(d.Details||'')}</textarea></label></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">ยกเลิก</button><button class="primary" onclick='saveEvent("${esc(d.EventID||'')}")'>บันทึก</button></div>`)}
async function saveEvent(id){await call('eventSave',{data:{EventID:id,Title:$('eTitle').value,Type:$('eType').value,Start:$('eStart').value,End:$('eEnd').value,Location:$('eLoc').value,Email:$('eEmail').value,Details:$('eDetails').value}});closeModal();loadEvents()}
async function loadAnnouncements(){const r=await call('announcements',{publicOnly:false});$('announcementList').innerHTML=r.data.map(a=>`<div class="announcement"><b>${esc(a.Title)}</b><span class="badge">${esc(a.Status)}</span><div>${esc(a.Description)}</div><button class="secondary" onclick='announcementForm(${JSON.stringify(a)})'>แก้ไข</button></div>`).join('')}
function announcementForm(d={}){modal(`<h3>ประกาศ</h3><div class="form-grid"><label>หัวข้อ<input id="aTitle" value="${esc(d.Title||'')}"></label><label>สถานะ<select id="aStatus"><option ${d.Status==='PUBLISHED'?'selected':''}>PUBLISHED</option><option ${d.Status==='DRAFT'?'selected':''}>DRAFT</option></select></label><label class="wide">รายละเอียด<textarea id="aDesc">${esc(d.Description||'')}</textarea></label><label>วันประกาศ<input id="aPub" type="date" value="${esc(d.PublishDate||'')}"></label><label>วันหมดอายุ<input id="aExp" type="date" value="${esc(d.ExpireDate||'')}"></label></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">ยกเลิก</button><button class="primary" onclick='saveAnnouncement("${esc(d.AnnouncementID||'')}")'>บันทึก</button></div>`)}
async function saveAnnouncement(id){await call('announcementSave',{data:{AnnouncementID:id,Title:$('aTitle').value,Description:$('aDesc').value,Status:$('aStatus').value,PublishDate:$('aPub').value,ExpireDate:$('aExp').value}});closeModal();loadAnnouncements()}
async function sendEmail(){await call('emailSend',{data:{to:$('mailTo').value,cc:$('mailCc').value,bcc:$('mailBcc').value,subject:$('mailSubject').value,body:$('mailBody').value}});toast('ส่ง Email สำเร็จ')}
async function loadReport(type){const r=await call('reports',{type});const rows=r.data||[];if(!rows.length){$('reportOut').innerHTML='<p>ไม่มีข้อมูล</p>';return}const h=Object.keys(rows[0]);$('reportOut').innerHTML='<table><thead><tr>'+h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,300).map(x=>'<tr>'+h.map(k=>'<td>'+esc(x[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
async function loadAdmins(){const r=await call('admins');$('adminsBody').innerHTML=r.data.map(a=>`<tr><td>${esc(a.Email)}</td><td>${esc(a.Name)}</td><td>${esc(a.Role)}</td><td>${esc(a.Permissions)}</td><td>${esc(a.Status)}</td><td><button class="secondary" onclick='adminForm(${JSON.stringify(a)})'>แก้ไข</button></td></tr>`).join('')}
function adminForm(d={}){modal(`<h3>Admin</h3><div class="form-grid"><label>Email<input id="adEmail" value="${esc(d.Email||'')}"></label><label>Name<input id="adName" value="${esc(d.Name||'')}"></label><label>Role<select id="adRole"><option>SUPER_ADMIN</option><option>ADMIN</option><option>SECRETARY</option><option>VIEWER</option></select></label><label>Permissions<input id="adPerm" value="${esc(d.Permissions||'')}"></label><label>Password<input id="adPwd" type="password"></label></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">ยกเลิก</button><button class="primary" onclick='saveAdmin("${esc(d.AdminID||'')}")'>บันทึก</button></div>`)}
async function saveAdmin(id){await call('adminSave',{data:{AdminID:id,Email:$('adEmail').value,Name:$('adName').value,Role:$('adRole').value,Permissions:$('adPerm').value,Password:$('adPwd').value}});closeModal();loadAdmins()}
async function runBackup(){await call('backup');toast('สร้าง Backup สำเร็จ')}
async function doSearch(){const q=$('globalSearch').value;const r=await call('search',{q});modal('<h3>ผลการค้นหา</h3>'+r.data.map(x=>`<div class="event"><b>${esc(x.module)}</b><pre>${esc(JSON.stringify(x.data,null,2))}</pre></div>`).join('')||'<p>ไม่พบข้อมูล</p>')}
async function loadNotifications(){const r=await call('notifications');modal('<h3>Notifications</h3>'+r.data.map(n=>`<div class="event"><b>${esc(n.Title)}</b><div>${esc(n.Message)}</div></div>`).join('')||'<p>ไม่มีแจ้งเตือน</p>')}
function modal(html){closeModal();const b=document.createElement('div');b.id='modal';b.className='modal-backdrop';b.innerHTML='<div class="modal">'+html+'</div>';document.body.appendChild(b)}
function closeModal(){const x=$('modal');if(x)x.remove()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
